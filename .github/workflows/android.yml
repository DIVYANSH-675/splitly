name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://gomowueeizpwzzbqugod.supabase.co/functions/v1/splitbill-api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix mobile ci
      - name: Verify source
        run: |
          npm test
          npm --prefix mobile run typecheck
          npm --prefix mobile run lint
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=${{ matrix.abi }} --no-daemon --max-workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: splitbill-${{ matrix.abi }}-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
